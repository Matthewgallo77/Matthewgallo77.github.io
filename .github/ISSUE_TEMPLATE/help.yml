name: ScrollDoctor support request
description: Ask for help with ScrollDoctor.
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. Please do not include your passcode or other sensitive information.
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: For example, iOS 18.6
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: ScrollDoctor version
      placeholder: You can find this on the App Store product page.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What do you need help with?
      options:
        - Screen Time permission
        - App selection
        - Daily limit
        - Protection or passcode
        - Usage history
        - Privacy question
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you expected and what you saw instead.
    validations:
      required: true

